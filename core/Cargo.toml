[package]
name = "core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UI-agnostic text manipulation engine for Skerry."

[dependencies]
dirs = "6"
memmap2 = "0.9"
memchr = "2"
notify = "6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
url = "2"
# lsp-types is pinned to a version known to build with the workspace
# MSRV (Rust 1.75). Verify before upgrading.
lsp-types = "0.95"
# tree-sitter is the syntax highlighting backend. Each grammar crate
# compiles a small C parser via `cc`; a working C toolchain (Xcode CLT
# on macOS) is required to build.
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-c = "0.24"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-md = { version = "0.5.3", features = ["parser"] }
tree-sitter-bash = "0.25.1"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-diff = "0.1.0"
tree-sitter-make = "1.1.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
