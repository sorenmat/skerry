[package]
name = "core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UI-agnostic text manipulation engine for the_editor."

[dependencies]
memmap2 = "0.9"
# memchr's memmem provides SIMD-accelerated substring search for
# the Find feature. The lighter `memchr` crate (no regex, no allocator)
# is enough — we only need the find_iter primitive.
memchr = "2"

