[package]
name = "core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UI-agnostic text manipulation engine for the_editor."

[dependencies]
dirs = "6"
memmap2 = "0.9"
memchr = "2"
notify = "6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
url = "2"
# lsp-types is pinned to a version known to build with the workspace
# MSRV (Rust 1.75). Verify before upgrading.
lsp-types = "0.95"
# tree-sitter is the syntax highlighting backend. Each grammar crate
# compiles a small C parser via `cc`; a working C toolchain (Xcode CLT
# on macOS) is required to build.
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-c = "0.24"
tree-sitter-json = "0.24"
tree-sitter-markdown = "0.7"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true