[package]
name = "core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UI-agnostic text manipulation engine for the_editor."

[dependencies]
dirs = "6"
memmap2 = "0.9"
memchr = "2"
notify = "6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
url = "2"
# lsp-types is pinned to a version known to build with the workspace
# MSRV (Rust 1.75). Verify before upgrading.
lsp-types = "0.95"
# syntect provides syntax highlighting for 200+ languages via
# Sublime Text syntax definitions. We use default-syntaxes +
# default-themes so every language and several themes ship baked-in.
# The `plist-load` feature lets us load custom syntax/theme files at
# runtime later. `onig` (the default regex engine) uses C FFI via
# Oniguruma — the workspace `unsafe_code = "deny"` lint only applies
# to our own crates, not to dependencies, so this is fine.
syntect = { version = "5", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "plist-load",
    "regex-fancy",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true