[package]
name = "skerry-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Terminal frontend for Skerry (ratatui + crossterm)."

[dependencies]
core = { path = "../core" }
ratatui = "0.29"
crossterm = "0.28"
# arboard gives us cross-platform OS clipboard access (X11/Wayland on
# Linux, Cocoa on macOS, Win32 on Windows). crossterm 0.28 dropped its
# own clipboard module, so this is the standard replacement.
# `wayland-data-control` uses the wlr data-control protocol so clipboard
# access works on Wayland compositors without the app owning a surface
# (a TUI has none). Without it arboard falls back to its X11 backend,
# whose clipboard does not bridge to Wayland-native apps on compositors
# without XWayland clipboard sync (e.g. Hyprland).
arboard = { version = "3", features = ["wayland-data-control"] }
# Native file dialogs for the terminal frontend. Opens the platform
# picker even when launched from a terminal on macOS/Linux.
rfd = "0.15"
# Transitive dependencies exposed by core's LSP API.
lsp-types = "0.95"
url = "2"

[lints]
workspace = true
