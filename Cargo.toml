[workspace]
members = ["core", "skerry-tui", "skerry"]
resolver = "2"

[workspace.package]
version = "0.1.8"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

