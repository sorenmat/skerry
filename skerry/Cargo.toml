[package]
name = "skerry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GUI frontend for Skerry (egui + eframe, swappable renderer)."

[dependencies]
core = { path = "../core" }
egui = "0.30"
eframe = "0.30"
pulldown-cmark = { version = "0.12.2", default-features = false }
csv = "1.3"
egui_extras = { version = "0.30", default-features = false }
rfd = "0.15"
# Transitive dependencies exposed by core's LSP API.
lsp-types = "0.95"
url = "2"

# The workspace denies `unsafe_code` via [workspace.lints] (command-line
# precedence, so #[allow] in source cannot override it). This crate needs
# one scoped exception for the macOS self-capture FFI in src/screenshot.rs.
# Keep the crate-wide deny in src/lib.rs (`#![deny(unsafe_code)]`), which
# source-level #[allow] in screenshot.rs can override narrowly.
[lints.rust]
unsafe_code = "allow"
