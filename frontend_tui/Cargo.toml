[package]
name = "frontend_tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Terminal frontend for the_editor (ratatui + crossterm)."

[dependencies]
core = { path = "../core" }
ratatui = "0.29"
crossterm = "0.28"
# arboard gives us cross-platform OS clipboard access (X11/Wayland on
# Linux, Cocoa on macOS, Win32 on Windows). crossterm 0.28 dropped its
# own clipboard module, so this is the standard replacement.
arboard = "3"
# Native file dialogs for the terminal frontend. Opens the platform
# picker even when launched from a terminal on macOS/Linux.
rfd = "0.15"

[lints]
workspace = true