name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verify release version
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "skerry") | .version')"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build Skerry
        run: cargo build --workspace --release --locked

      - name: Build application bundle
        run: ./scripts/build-app-bundle.sh

      - name: Verify application bundle contents
        run: |
          test -x target/Skerry.app/Contents/Resources/skerry
          test -x target/Skerry.app/Contents/Resources/skerry-tui

      - name: Package application bundle
        run: tar -czf "Skerry-macos-${{ matrix.arch }}.tar.gz" -C target Skerry.app

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Skerry-macos-${{ matrix.arch }}
          path: Skerry-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verify release version
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "skerry") | .version')"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build Skerry
        run: cargo build --workspace --release --locked

      - name: Package Linux binaries
        run: bash scripts/package-linux.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Skerry-linux-x86_64
          path: Skerry-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: Skerry-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_note="⚠️ The macOS builds are ad-hoc signed and not Apple-notarized. Read the [installation guidance](https://github.com/$GH_REPO/blob/$RELEASE_TAG/INSTALL.md) before opening them."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            existing_notes="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
            if ! printf '%s' "$existing_notes" | grep -Fq -- "$release_note"; then
              printf '%s\n\n%s\n' "$release_note" "$existing_notes" \
                > "$RUNNER_TEMP/release-notes.md"
              gh release edit "$RELEASE_TAG" \
                --notes-file "$RUNNER_TEMP/release-notes.md"
            fi
            gh release upload "$RELEASE_TAG" dist/*.tar.gz --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.tar.gz \
              --generate-notes \
              --notes "$release_note" \
              --verify-tag
          fi
